<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Ramba Trash</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Courier New", monospace;
      }
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 1000;
        max-width: 300px;
      }
      #hud h3 {
        margin: 0 0 10px 0;
        color: #00ff00;
        font-size: 16px;
      }
      #hud .link-info {
        margin: 5px 0;
      }
      #hud .distance {
        color: #ffaa00;
      }
      #hud .action {
        color: #00ffff;
        margin-top: 10px;
        font-weight: bold;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0.3;
        }
      }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 1000;
      }
      #mobile-controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: none;
        z-index: 1000;
        pointer-events: none;
      }

      #joystick-container {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 120px;
        height: 120px;
        pointer-events: auto;
      }

      #joystick-base {
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.1);
        border: 3px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        position: relative;
      }

      #joystick-stick {
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.6);
        border: 3px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: all 0.1s ease;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }

      #joystick-stick:active {
        background: rgba(255, 255, 255, 0.8);
      }

      #action-button {
        position: absolute;
        bottom: 30px;
        left: 30px;
        width: 80px;
        height: 80px;
        background: rgba(0, 255, 100, 0.3);
        border: 4px solid rgba(0, 255, 100, 0.6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        pointer-events: auto;
        user-select: none;
        box-shadow: 0 0 20px rgba(0, 255, 100, 0.4);
      }

      #action-button:active {
        background: rgba(0, 255, 100, 0.6);
        transform: scale(0.95);
      }

      #action-button.inactive {
        background: rgba(100, 100, 100, 0.3);
        border-color: rgba(100, 100, 100, 0.6);
        box-shadow: none;
      }

      #next-link-button {
        position: absolute;
        bottom: 30px;
        left: 130px;
        width: 80px;
        height: 80px;
        background: rgba(0, 100, 255, 0.3);
        border: 4px solid rgba(0, 100, 255, 0.6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        pointer-events: auto;
        user-select: none;
        box-shadow: 0 0 20px rgba(0, 100, 255, 0.4);
      }

      #next-link-button:active {
        background: rgba(0, 100, 255, 0.6);
        transform: scale(0.95);
      }

      #next-link-button.inactive {
        background: rgba(100, 100, 100, 0.3);
        border-color: rgba(100, 100, 100, 0.6);
        box-shadow: none;
      }

      @media (max-width: 768px) {
        #mobile-controls {
          display: block;
        }
        #controls {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h3>Magic Ramba Trash Universe</h3>
      <div id="nearest-link">Erkunde den Raum...</div>
    </div>

    <div id="controls">
      <strong>Steuerung:</strong><br />
      ← → ↑ ↓ Navigation<br />
      <span style="color: #00ffff">ENTER/LEERTASTE</span> = Link öffnen
    </div>

    <div id="mobile-controls">
      <div id="joystick-container">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
      <div id="action-button" class="inactive">⏎</div>
      <div id="next-link-button" class="inactive">→</div>
    </div>

    <script>
      // ==================== LINK DATA ====================
      const linkData = [
        {
          title: "Somewhere in a Carrot Field",
          url: "https://youtu.be/5aqjgMyLG5o?si=3JkD_Nx2CWLkOOVO",
          description: "Band: Artlu Bubble and the Dead Animal Gang",
          category: "Musicvideo",
        },
        {
          title: "Adolf",
          url: "https://youtu.be/zZAojfcRn14?si=UtXPR-Vnpe96I1ju",
          description: "Band: Mike Ständer Band",
          category: "Musicvideo",
        },
        {
          title: "Nothing",
          url: "https://youtu.be/Bc8TdmOhQQo?si=LW69Fu47xNoIyQrs",
          description: "Band: Shah Blah",
          category: "Musicvideo",
        },
        {
          title: "Infantiler Bullshit",
          url: "https://youtu.be/HXqHBI38OUY?si=GYdEGtdVJTHfykZz",
          description: "Band: Mike Ständer Band",
          category: "Musicvideo",
        },
        {
          title: "Puppet Factory",
          url: "https://youtu.be/oTgBFSO_Yo8?si=T9E438bC7eKgZnGi",
          description: "Band: Deserto Parallax",
          category: "Musicvideo",
        },
        {
          title: "Holy Shelter",
          url: "https://youtu.be/hDgQwmotsV4?si=4ZmQSYxVIhJvT5hP",
          description: "Band: Shah Blah",
          category: "Musicvideo",
        },
        {
          title: "Who Sells Out",
          url: "https://youtu.be/zJbVd3pLQqk?si=M9o_t8Xb-LJ4H8py",
          description: "Band: Shah Blah",
          category: "Musicvideo",
        },
      ];

      // ==================== GLOBALS ====================
      let stars = [];
      let ship;
      let links = [];
      let navi = [];
      let planets = [];

      let navBorder = 25;
      let xMin = -3000;
      let yMin = -3000;
      let xMax = 3000;
      let yMax = 3000;

      let nearestLink = null;
      let selectedLinkIndex = null;
      let activationDistance = 150;

      // Mobile controls
      let joystick = {
        active: false,
        startX: 0,
        startY: 0,
        deltaX: 0,
        deltaY: 0,
        maxDistance: 35,
      };

      // Movement acceleration towards selected link
      let baseMoveSpeed = 1;
      let accelerationFactor = 0; // current extra acceleration multiplier (0..maxAccMultiplier)
      let accRate = 0.05; // how fast acceleration increases per frame
      let decRate = 0.1; // how fast acceleration decreases per frame
      let maxAccMultiplier = 10; // maximum additional multiplier (speed = baseMoveSpeed * (1 + accelerationFactor))

      // ==================== CLASSES ====================

      class Star {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.color = color(random(200, 255));
          this.size = random(1, 4);
          this.speedMin = 1;
          this.speedMax = 25;
          this.speed = random(this.speedMin, this.speedMax);
        }

        display() {
          noStroke();
          fill(this.color);
          rect(this.x, this.y, this.size, this.size);
        }

        checkBorder() {
          if (this.x < 0) {
            this.x = width;
            this.y = random(height);
            this.color = color(random(200, 255));
            this.speed = random(this.speedMin, this.speedMax);
          } else if (this.x > width) {
            this.x = 0;
            this.y = random(height);
            this.color = color(random(200, 255));
            this.speed = random(this.speedMin, this.speedMax);
          } else if (this.y < 0) {
            this.x = random(width);
            this.y = height;
            this.color = color(random(200, 255));
            this.speed = random(this.speedMin, this.speedMax);
          } else if (this.y > height) {
            this.x = random(width);
            this.y = 0;
            this.color = color(random(200, 255));
            this.speed = random(this.speedMin, this.speedMax);
          }
        }
      }

      class Ship {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = 40;
        }

        display() {
          push();
          translate(this.x, this.y);

          // UFO Body
          fill(255, 100, 255);
          stroke(255, 150, 255);
          strokeWeight(2);
          ellipse(0, 0, this.size * 2, this.size);

          // UFO Dome
          fill(150, 50, 150, 180);
          ellipse(0, -10, this.size, this.size * 0.6);

          // Lights
          fill(0, 255, 255);
          noStroke();
          ellipse(-15, 5, 5, 5);
          ellipse(0, 5, 5, 5);
          ellipse(15, 5, 5, 5);

          pop();
        }
      }

      class Link {
        constructor(x, y, data) {
          this.x = x;
          this.y = y;
          this.data = data;
          this.baseColor = color(
            random(100, 255),
            random(100, 255),
            random(100, 255)
          );
          this.currentColor = this.baseColor;
          this.txtSize = 24;
          this.speed = random(7, 10);
          this.pulsePhase = random(TWO_PI);
        }

        display(isNearest) {
          push();

          if (isNearest) {
            // Pulsing effect for nearest link
            this.pulsePhase += 0.1;
            let pulse = sin(this.pulsePhase) * 0.3 + 1;

            // Glow effect
            drawingContext.shadowBlur = 30;
            drawingContext.shadowColor = "rgba(0, 255, 255, 0.8)";

            fill(0, 255, 255);
            textSize(this.txtSize * pulse);
          } else {
            fill(this.baseColor);
            textSize(this.txtSize);
          }

          noStroke();
          textAlign(CENTER, CENTER);
          text(this.data.title, this.x, this.y);

          // Category badge
          textSize(12);
          fill(255, 255, 0, 150);
          text(this.data.category, this.x, this.y + 25);

          pop();
        }

        getDistance(shipX, shipY) {
          return dist(this.x, this.y, shipX, shipY);
        }
      }

      class Navigator {
        lineLine(x1, y1, x2, y2, x3, y3, x4, y4, col, linkName) {
          let uA =
            ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) /
            ((y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1));
          let uB =
            ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) /
            ((y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1));

          if (uA >= 0 && uA <= 1 && uB >= 0 && uB <= 1) {
            let intersectionX = x1 + uA * (x2 - x1);
            let intersectionY = y1 + uA * (y2 - y1);

            // Draw circle
            fill(col);
            noStroke();
            ellipse(intersectionX, intersectionY, 12);

            // Draw link name
            fill(255, 255, 255, 200);
            textSize(11);
            textAlign(CENTER, CENTER);

            // Position text based on border location
            let textX = intersectionX;
            let textY = intersectionY;

            // Left or right border
            if (intersectionX < navBorder + 10) {
              textAlign(LEFT, CENTER);
              textX = intersectionX + 10;
            } else if (intersectionX > width - navBorder - 10) {
              textAlign(RIGHT, CENTER);
              textX = intersectionX - 10;
            }

            // Top or bottom border
            if (intersectionY < navBorder + 10) {
              textY = intersectionY + 15;
            } else if (intersectionY > height - navBorder - 10) {
              textY = intersectionY - 15;
            }

            text(linkName, textX, textY);

            return true;
          }
          return false;
        }
      }

      class Planet {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.speed = random(7, 10);
          this.size = random(50, 350);
          this.hue = random(360);
        }

        display() {
          push();
          colorMode(HSB);
          fill(this.hue, 80, 80, 150);
          noStroke();
          ellipse(this.x, this.y, this.size, this.size);

          // Rings for some planets
          if (random() > 0.7) {
            noFill();
            stroke(this.hue, 60, 90, 100);
            strokeWeight(3);
            ellipse(this.x, this.y, this.size * 1.5, this.size * 0.5);
          }
          pop();
        }
      }

      // ==================== P5.JS SETUP ====================

      function setup() {
        createCanvas(windowWidth, windowHeight);
        smooth();
        textAlign(CENTER, CENTER);

        // Stars
        for (let i = 0; i < 333; i++) {
          stars.push(new Star(random(width), random(height)));
        }

        // Ship
        ship = new Ship(width / 2, height / 2);

        // Links
        for (let i = 0; i < linkData.length; i++) {
          let x = random(xMin, width + xMax);
          let y = random(yMin, height + yMax);
          links.push(new Link(x, y, linkData[i]));
          navi.push(new Navigator());
        }

        // Planets
        for (let i = 0; i < 15; i++) {
          let x = random(xMin, width + xMax);
          let y = random(yMin, height + yMax);
          planets.push(new Planet(x, y));
        }

        // Mobile controls
        setupMobileControls();
      }

      // ==================== P5.JS DRAW ====================

      function draw() {
        background(10, 10, 30);

        // Stars
        for (let star of stars) {
          star.display();
          star.checkBorder();
        }

        // Planets
        for (let planet of planets) {
          planet.display();
        }

        // Find nearest link
        nearestLink = null;
        let minDist = Infinity;
        for (let link of links) {
          let d = link.getDistance(ship.x, ship.y);
          if (d < minDist) {
            minDist = d;
            nearestLink = link;
          }
        }

        // Navigators - show direction to links
        for (let i = 0; i < links.length; i++) {
          let isNearest = links[i] === nearestLink;
          let col = isNearest ? color(0, 255, 255, 180) : color(255, 0, 0, 180);
          let linkName = links[i].data.title;

          // Draw indicators on borders
          navi[i].lineLine(
            links[i].x,
            links[i].y,
            ship.x,
            ship.y,
            navBorder,
            navBorder,
            navBorder,
            height - navBorder,
            col,
            linkName
          );
          navi[i].lineLine(
            links[i].x,
            links[i].y,
            ship.x,
            ship.y,
            width - navBorder,
            navBorder,
            width - navBorder,
            height - navBorder,
            col,
            linkName
          );
          navi[i].lineLine(
            links[i].x,
            links[i].y,
            ship.x,
            ship.y,
            navBorder,
            navBorder,
            width - navBorder,
            navBorder,
            col,
            linkName
          );
          navi[i].lineLine(
            links[i].x,
            links[i].y,
            ship.x,
            ship.y,
            navBorder,
            height - navBorder,
            width - navBorder,
            height - navBorder,
            col,
            linkName
          );
        }

        // Display links
        for (let link of links) {
          let isNearest = link === nearestLink;
          link.display(isNearest);
        }

        // Draw navigation line to selected link
        if (selectedLinkIndex !== null && selectedLinkIndex < links.length) {
          let selectedLink = links[selectedLinkIndex];
          // Random neon color
          let hue = random(360);
          colorMode(HSB);
          stroke(hue, 100, 100);
          colorMode(RGB);
          strokeWeight(4);
          line(ship.x, ship.y, selectedLink.x, selectedLink.y);
        }

        // Ship
        ship.display();

        // Handle input
        handleInput();

        // Update HUD
        updateHUD(minDist);

        // Update mobile action button state
        if (window.updateActionButton) {
          window.updateActionButton();
        }
      }

      // ==================== INPUT HANDLING ====================

      function handleInput() {
        // Determine input direction from keyboard and joystick
        let inputX = 0;
        let inputY = 0;
        if (keyIsDown(LEFT_ARROW)) {
          inputX -= 1;
        }
        if (keyIsDown(RIGHT_ARROW)) {
          inputX += 1;
        }
        if (keyIsDown(UP_ARROW)) {
          inputY -= 1;
        }
        if (keyIsDown(DOWN_ARROW)) {
          inputY += 1;
        }

        // Add joystick direction (analog)
        if (joystick.active) {
          if (Math.abs(joystick.deltaX) > 5)
            inputX += Math.sign(joystick.deltaX);
          if (Math.abs(joystick.deltaY) > 5)
            inputY += Math.sign(joystick.deltaY);
        }

        let moving = inputX !== 0 || inputY !== 0;

        // If the selected link is on-screen or within activation distance, stop movement, reset acceleration and deselect
        if (selectedLinkIndex !== null && selectedLinkIndex < links.length) {
          let selReach = links[selectedLinkIndex];

          // On-screen check: deselect as soon as the link is visible on the canvas
          if (
            selReach.x >= 0 &&
            selReach.x <= width &&
            selReach.y >= 0 &&
            selReach.y <= height
          ) {
            accelerationFactor = 0;
            selectedLinkIndex = null;
            return;
          }

          let dReach = selReach.getDistance(ship.x, ship.y);
          if (dReach <= activationDistance) {
            // we reached the link; stop movement, reset acceleration and deselect it
            accelerationFactor = 0;
            selectedLinkIndex = null;
            return;
          }
        }

        // Acceleration towards selected link when moving in its direction
        if (
          selectedLinkIndex !== null &&
          selectedLinkIndex < links.length &&
          moving
        ) {
          let sel = links[selectedLinkIndex];
          let lx = sel.x - ship.x;
          let ly = sel.y - ship.y;
          let distToLink = Math.sqrt(lx * lx + ly * ly);

          if (distToLink > 0) {
            let nlx = lx / distToLink;
            let nly = ly / distToLink;

            let lenInput = Math.sqrt(inputX * inputX + inputY * inputY);
            let nix = inputX / lenInput;
            let niy = inputY / lenInput;

            // dot product: 1 means exact same direction
            let dot = nlx * nix + nly * niy;

            if (dot > 0.7) {
              accelerationFactor = Math.min(
                maxAccMultiplier,
                accelerationFactor + accRate
              );
            } else {
              accelerationFactor = Math.max(0, accelerationFactor - decRate);
            }
          } else {
            accelerationFactor = 0;
          }
        } else {
          // decay acceleration when not moving toward selected link
          accelerationFactor = Math.max(0, accelerationFactor - decRate);
        }

        // Compute move speeds including acceleration
        let moveSpeed = baseMoveSpeed * (1 + accelerationFactor);

        // Keyboard movement (preserve original sign convention)
        if (keyIsDown(LEFT_ARROW)) {
          moveObjects("x", moveSpeed);
        }
        if (keyIsDown(RIGHT_ARROW)) {
          moveObjects("x", -moveSpeed);
        }
        if (keyIsDown(UP_ARROW)) {
          moveObjects("y", moveSpeed);
        }
        if (keyIsDown(DOWN_ARROW)) {
          moveObjects("y", -moveSpeed);
        }

        // Joystick controls (scaled and affected by acceleration)
        if (joystick.active) {
          let speedMultiplier = 0.03 * (1 + accelerationFactor);
          if (Math.abs(joystick.deltaX) > 5) {
            moveObjects("x", -joystick.deltaX * speedMultiplier);
          }
          if (Math.abs(joystick.deltaY) > 5) {
            moveObjects("y", -joystick.deltaY * speedMultiplier);
          }
        }
      }

      function moveObjects(axis, speed) {
        for (let star of stars) {
          star[axis] += star.speed * speed;
        }
        for (let link of links) {
          link[axis] += link.speed * speed;
        }
        for (let planet of planets) {
          planet[axis] += planet.speed * speed;
        }
      }

      function keyPressed() {
        // Open link on ENTER or SPACE
        if ((key === "Enter" || key === " ") && nearestLink) {
          let d = nearestLink.getDistance(ship.x, ship.y);
          if (d < activationDistance) {
            window.open(nearestLink.data.url, "_blank");
            // reset acceleration when a link is reached/opened
            accelerationFactor = 0;
          }
        }
        // Next link on S key
        if (key === "s" || key === "S") {
          selectNextLink();
        }
        // Deselect on ESC key
        if (key === "Escape") {
          selectedLinkIndex = null;
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        ship.x = width / 2;
        ship.y = height / 2;
      }

      // ==================== HUD UPDATE ====================

      function updateHUD(distance) {
        let hudElement = document.getElementById("nearest-link");

        // Prioritize selected link over nearest link
        let displayLink = null;
        if (selectedLinkIndex !== null && selectedLinkIndex < links.length) {
          displayLink = links[selectedLinkIndex];
        } else if (nearestLink) {
          displayLink = nearestLink;
        }

        if (displayLink) {
          let isSelected =
            selectedLinkIndex !== null &&
            displayLink === links[selectedLinkIndex];
          let linkDistance = displayLink.getDistance(ship.x, ship.y);

          // Only show the S/Select instruction on desktop (not mobile)
          const isMobile =
            window.matchMedia &&
            window.matchMedia("(max-width: 768px)").matches;
          hudElement.innerHTML = `
          <div class="link-info">
            <strong style="color: ${isSelected ? "#00ff00" : "#00ffff"}">${
            displayLink.data.title
          }</strong>${isSelected ? " (SELECTED)" : ""}<br>
            ${displayLink.data.description}<br>
            <span style="color: #ffaa00;">${displayLink.data.category}</span>
          </div>
          <div class="distance">Distanz: ${Math.round(linkDistance)}px</div>
          <div style="color: #888; margin-top: 10px;">
            ${
              !isMobile
                ? isSelected
                  ? "S um zum nächsten Link zu wechseln"
                  : "S um Link zu wählen"
                : ""
            }
            ${linkDistance < activationDistance ? "<br>⏎ ENTER zum Öffnen" : ""}
          </div>
        `;
        } else {
          hudElement.innerHTML = `Erkunde den Raum...`;
        }
      }

      function selectNextLink() {
        if (links.length === 0) return;

        // Start searching after the current selection (or from 0 if none)
        let start =
          selectedLinkIndex === null
            ? 0
            : (selectedLinkIndex + 1) % links.length;
        let found = null;

        // Loop through all links at most once and pick the first off-screen link
        for (let i = 0; i < links.length; i++) {
          let idx = (start + i) % links.length;
          let l = links[idx];
          let onScreen = l.x >= 0 && l.x <= width && l.y >= 0 && l.y <= height;
          if (!onScreen) {
            found = idx;
            break;
          }
        }

        if (found !== null) {
          selectedLinkIndex = found;
        } else {
          // No off-screen links available — clear selection
          selectedLinkIndex = null;
        }
      }

      // ==================== MOBILE CONTROLS ====================

      function setupMobileControls() {
        const joystickBase = document.getElementById("joystick-base");
        const joystickStick = document.getElementById("joystick-stick");
        const actionButton = document.getElementById("action-button");
        const nextLinkButton = document.getElementById("next-link-button");

        // Joystick controls
        function handleJoystickStart(e) {
          e.preventDefault();
          joystick.active = true;
          const rect = joystickBase.getBoundingClientRect();
          joystick.startX = rect.left + rect.width / 2;
          joystick.startY = rect.top + rect.height / 2;
        }

        function handleJoystickMove(e) {
          if (!joystick.active) return;
          e.preventDefault();

          const touch = e.touches ? e.touches[0] : e;
          const rect = joystickBase.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          // Calculate delta from center
          let deltaX = touch.clientX - centerX;
          let deltaY = touch.clientY - centerY;

          // Limit to max distance
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          if (distance > joystick.maxDistance) {
            const angle = Math.atan2(deltaY, deltaX);
            deltaX = Math.cos(angle) * joystick.maxDistance;
            deltaY = Math.sin(angle) * joystick.maxDistance;
          }

          joystick.deltaX = deltaX;
          joystick.deltaY = deltaY;

          // Update stick position
          joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
        }

        function handleJoystickEnd(e) {
          e.preventDefault();
          joystick.active = false;
          joystick.deltaX = 0;
          joystick.deltaY = 0;
          joystickStick.style.transform = "translate(-50%, -50%)";
        }

        // Touch events for joystick
        joystickBase.addEventListener("touchstart", handleJoystickStart);
        document.addEventListener("touchmove", handleJoystickMove);
        document.addEventListener("touchend", handleJoystickEnd);

        // Mouse events for testing on desktop
        joystickBase.addEventListener("mousedown", handleJoystickStart);
        document.addEventListener("mousemove", handleJoystickMove);
        document.addEventListener("mouseup", handleJoystickEnd);

        // Action button
        actionButton.addEventListener("touchstart", (e) => {
          e.preventDefault();
          activateLink();
        });

        actionButton.addEventListener("click", (e) => {
          e.preventDefault();
          activateLink();
        });

        // Next link button
        nextLinkButton.addEventListener("touchstart", (e) => {
          e.preventDefault();
          selectNextLink();
        });

        nextLinkButton.addEventListener("click", (e) => {
          e.preventDefault();
          selectNextLink();
        });

        // Update button appearances based on link proximity
        function updateActionButton() {
          let selectedLink = null;
          if (selectedLinkIndex !== null && selectedLinkIndex < links.length) {
            selectedLink = links[selectedLinkIndex];
          }

          // Action button state
          if (selectedLink) {
            let d = selectedLink.getDistance(ship.x, ship.y);
            if (d < activationDistance) {
              actionButton.classList.remove("inactive");
            } else {
              actionButton.classList.add("inactive");
            }
          } else {
            actionButton.classList.add("inactive");
          }

          // Next link button state
          if (links.length > 0) {
            nextLinkButton.classList.remove("inactive");
          } else {
            nextLinkButton.classList.add("inactive");
          }
        }

        // Call this in draw loop
        window.updateActionButton = updateActionButton;
      }

      function activateLink() {
        let selectedLink = null;
        if (selectedLinkIndex !== null && selectedLinkIndex < links.length) {
          selectedLink = links[selectedLinkIndex];
        }

        if (selectedLink) {
          let d = selectedLink.getDistance(ship.x, ship.y);
          if (d < activationDistance) {
            window.open(selectedLink.data.url, "_blank");
            // reset acceleration now that link is reached
            accelerationFactor = 0;
          }
        }
      }
    </script>
  </body>
</html>
